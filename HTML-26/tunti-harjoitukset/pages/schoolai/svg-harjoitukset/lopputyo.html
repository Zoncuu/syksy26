<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG -lopputyo</title>
    <link rel="stylesheet" href="../../../css/style.css">

    <style>
        h2 {
            text-align: center;
        }
        .aurinko {
            fill: yellow;
            stroke: orange;
            stroke-width: 2;
        }
    </style>
    <link rel="stylesheet" href="../../../../../main/css/course-footer.css">
</head>

<body>
    <header>
        <h1>SVG -lopputyo | Kesämökki</h1>
    </header>

    <main>
        <h2>Kesämökki järven rannalla</h2>

        <svg viewBox="0 0 800 600" role="img" aria-labelledby="otsikko kuvaus">
            <title id="otsikko">Kesämökki</title>
            <desc id="kuvaus">
                Kesämökki järven rannassa ja taustalla auringonlasku
            </desc>

            <!-- Vesi ja maisema -->
            <rect
                x="0"
                y="450"
                width="800"
                height="150"
                fill="#87CEEB"
            />

            <rect
                x="0"
                y="200"
                width="800"
                height="250"
                fill="#7CFC00"
            />

            <defs>
                <linearGradient id="taivas" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="yellow" />
                    <stop offset="75%" stop-color="darkorange" />
                    <stop offset="100%" stop-color="#FF4B33" />
                </linearGradient>
            </defs>

            <rect
                x="0"
                y="0"
                width="800"
                height="200"
                fill="url(#taivas)"
            />

            <!-- Mökki -->
            <rect
                x="280"
                y="180"
                width="240"
                height="200"
                fill="#8B4513"
            />

            <polygon
                points="260,180 400,80 540,180"
                fill="black"
            />

            <rect
                x="300"
                y="270"
                width="60"
                height="108"
                fill="#A0522D"
                stroke="black"
                stroke-width="2"
            />

            <line
                x1="310"
                y1="335"
                x2="322"
                y2="335"
                stroke="black"
                stroke-width="4"
            />

            <circle
                cx="309"
                cy="335"
                r="4"
                fill="black"
            />

            <g fill="lightblue" stroke="black" stroke-width="2">
                <rect
                    x="305"
                    y="275"
                    width="50"
                    height="50"
                />

                <line
                    x1="305"
                    y1="300"
                    x2="355"
                    y2="300"
                />

                <line
                    x1="330"
                    y1="275"
                    x2="330"
                    y2="325"
                />

                <circle
                    cx="400"
                    cy="220"
                    r="30"
                />

                <path
                    d="M400,190 L400,250 M370,220 L430,220"
                    fill="none"
                    stroke="black"
                    stroke-width="2"
                />

                <rect
                    x="400"
                    y="280"
                    width="100"
                    height="60"
                    stroke="black"
                    stroke-width="2"
                />

                <path
                    d="M450,280 L450,340 M400,310 L500,310"
                    stroke="black"
                    stroke-width="2"
                />
            </g>

            <!-- Aurinko
                 Väri ja reunus määritellään CSS:llä -->
            <path
                class="aurinko"
                d="M 160 200 A 40 40 0 0 1 240 200 Z"
            />

            <!-- Teksti -->
            <text
                x="730"
                y="580"
                fill="black"
                font-size="20"
                text-anchor="middle">
                Kesämökki
            </text>

            <!-- Savupiippu -->
            <polygon
                points="330,130 350,116 350,80 330,80"
                fill="grey"
                stroke="black"
                stroke-width="1"
            />

            <!-- Savu
                 Opacity määritellään JavaScriptillä -->
            <g id="savu" fill="lightgrey">
                <circle cx="340" cy="65" r="12" />
                <circle cx="325" cy="55" r="16" />
                <circle cx="310" cy="40" r="20" />
                <circle cx="290" cy="25" r="20" />
                <circle cx="270" cy="10" r="25" />
                <circle cx="250" cy="0" r="30" />
            </g>
        </svg>
    </main>

    

    <script>
        const savu = document.getElementById("savu");
        savu.setAttribute("opacity", "0.7");
    </script>

    <!--ETUSIVUN FOOTER-->
    <footer class="course-home-footer" aria-label="Kurssinavigaatio">
        <a href="../../../../../index.html">Etusivulle</a>
    </footer>
</body>
</html>
