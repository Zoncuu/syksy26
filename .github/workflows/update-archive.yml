name: Päivitä kurssiarkisto

on:
    push:
        branches:
            - main
        paths:
            - "HTML-26/**/*.html"
            - "CSS-26/**/*.html"
            - "JavaScript-26/**/*.html"
            - "main/generate-archive.mjs"
            - ".github/workflows/update-archive.yml"
    workflow_dispatch:

permissions:
    contents: write

jobs:
    update-archive:
        runs-on: ubuntu-latest

        steps:
            - name: Hae repository
              uses: actions/checkout@v6

            - name: Muodosta HTML-sivujen luettelo
              run: node main/generate-archive.mjs

            - name: Tallenna muuttunut luettelo
              shell: bash
              run: |
                  if git diff --quiet -- main/pages.json; then
                      echo "Kurssiarkisto on jo ajan tasalla."
                      exit 0
                  fi

                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add main/pages.json
                  git commit -m "Päivitä kurssiarkisto automaattisesti"
                  git push
